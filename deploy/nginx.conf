# CyberCraft backend — nginx site.
#
# Copy to /etc/nginx/sites-available/cybercraft, symlink into
# sites-enabled, replace the placeholders, then `nginx -t && systemctl
# reload nginx`.
#
# This file is why production works at all for media: Django only serves
# /media/ when DEBUG is on, so without a reverse proxy every skin, cape,
# mod file and launcher installer 404s.

upstream cybercraft_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.cybercraft.uz;   # <-- replace

    # Uploading a server as a ZIP is allowed up to 2 GB by
    # SERVER_ZIP_MAX_UPLOAD_BYTES. nginx defaults to 1 MB, which would
    # reject those uploads with 413 before Django ever sees them.
    client_max_body_size 2g;
    client_body_timeout 300s;

    # Serving a 200 MB modpack through Django would tie up a worker for the
    # whole transfer.
    location /media/ {
        alias /srv/cybercraft/backend/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /srv/cybercraft/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Channels: live server console and launcher events.
    location /ws/ {
        proxy_pass http://cybercraft_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A console can sit idle between log lines; the default 60s would
        # drop it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://cybercraft_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this when USE_SSL is on.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# TLS
#
# Run `certbot --nginx -d api.cybercraft.uz` once the DNS record exists.
# Certbot rewrites the block above to listen on 443 and adds the redirect.
# After that, set USE_SSL=1 in the backend .env so Django turns on HSTS,
# secure cookies and the SSL redirect.
# ---------------------------------------------------------------------------
